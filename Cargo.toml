#:tombi toml-version = "v1.0.0"

[package]
name = "tenax"
version = "0.0.3"
edition = "2024"
rust-version = "1.99"
description = "Scenario discovery and robust decision-making under deep uncertainty"
readme = "README.md"
repository = "https://github.com/shunichironomura/tenax"
license = "MIT OR Apache-2.0"
keywords = ["decision-making", "prim", "scenario-discovery", "uncertainty"]
categories = ["algorithms", "mathematics", "science"]

[package.metadata.docs.rs]
features = ["arrow", "graphcal"]

[[test]]
name = "graphcal_workflow"
path = "tests/graphcal_workflow.rs"
required-features = ["graphcal"]

[dependencies]
arrow-array = { version = "60.0.0", optional = true }
arrow-ipc = { version = "60.0.0", optional = true }
arrow-schema = { version = "60.0.0", optional = true }
graphcal-model-client = { version = "=0.0.1-alpha.40", optional = true }
graphcal-model-protocol = "=0.0.1-alpha.40"
rand = { version = "0.10.2", default-features = false, features = ["std"] }
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.19"

[dev-dependencies]
arrow-select = "60.0.0"
rand_distr = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[features]
graphcal = ["dep:graphcal-model-client"]
arrow = [
  "dep:arrow-array",
  "dep:arrow-ipc",
  "dep:arrow-schema",
  "dep:serde",
  "dep:serde_json",
  "graphcal-model-protocol/arrow",
]

[lints.clippy]
all = "warn"
allow_attributes = { level = "warn", priority = 1 }
allow_attributes_without_reason = { level = "warn", priority = 1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }  # deny-by-default
dbg_macro = { level = "warn", priority = 1 }
decimal_literal_representation = { level = "warn", priority = 1 }
derive_partial_eq_without_eq = { level = "allow", priority = 1 }  # We implement `Eq` only when necessary
else_if_without_else = { level = "warn", priority = 1 }
expect_used = { level = "warn", priority = 1 }
indexing_slicing = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_errors_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_panics_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
multiple_crate_versions = { level = "allow", priority = 1 }  # There is nothing we can do about this
nursery = { level = "warn", priority = -1 }
panic = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
print_stderr = { level = "warn", priority = 1 }
print_stdout = { level = "warn", priority = 1 }
style = { level = "warn", priority = -1 }  # warn-by-default
suspicious = { level = "warn", priority = -1 }
todo = { level = "warn", priority = 1 }
undocumented_unsafe_blocks = { level = "warn", priority = 1 }
unimplemented = { level = "warn", priority = 1 }
unreachable = { level = "warn", priority = 1 }
unwrap_used = { level = "warn", priority = 1 }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
