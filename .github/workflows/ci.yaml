name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

jobs:
  checks:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy (core)
        run: cargo clippy --locked --all-targets --no-default-features
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features
      - name: Documentation (core)
        run: cargo doc --locked --no-deps --no-default-features
      - name: Documentation (all features)
        run: cargo doc --locked --no-deps --all-features

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets excludes doctests, so run them separately below.
      # These tests consume the independent EMA fixture; do not regenerate it.
      - name: Test core
        run: cargo test --locked --all-targets --no-default-features --no-fail-fast
      - name: Test all features
        run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: Doctests (core)
        run: cargo test --locked --doc --no-default-features
      - name: Doctests (all features)
        run: cargo test --locked --doc --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hack
      # Read rust-version from Cargo.toml rather than duplicating it here.
      - name: Check every feature on MSRV
        run: cargo hack check --locked --rust-version --each-feature --all-targets

  graphcal:
    name: Graphcal end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Keep in step with the graphcal-model-client version in Cargo.toml.
      - id: graphcal
        uses: graphcal-lang/setup-graphcal@782a4e6ee3b62ba173b37cd02beae4516681a502 # v1.0.0
        with:
          version: 0.0.1-alpha.42
      - name: Test against a real graphcal model server
        env:
          GRAPHCAL_BIN: ${{ steps.graphcal.outputs.path }}
        run: cargo test --locked --features graphcal --test graphcal_workflow -- --ignored

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  workflows:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail on findings without requiring SARIF upload permissions.
          advanced-security: false

  ci-gate:
    name: CI gate
    needs: [checks, test, msrv, graphcal, audit, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
