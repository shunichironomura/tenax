name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

jobs:
  checks:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy (core)
        run: cargo clippy --locked --all-targets --no-default-features
      - name: Clippy (Arrow)
        run: cargo clippy --locked --all-targets --no-default-features --features arrow
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features
      - name: Documentation (core)
        run: cargo doc --locked --no-deps --no-default-features
      - name: Documentation (all features)
        run: cargo doc --locked --no-deps --all-features

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets excludes doctests, so run them separately below.
      # These tests consume the independent EMA fixture; do not regenerate it.
      - name: Test core
        run: cargo test --locked --all-targets --no-default-features --no-fail-fast
      - name: Test Arrow
        run: cargo test --locked --all-targets --no-default-features --features arrow --no-fail-fast
      - name: Test all features (including stdio subprocesses)
        run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: Doctests (core)
        run: cargo test --locked --doc --no-default-features
      - name: Doctests (Arrow)
        run: cargo test --locked --doc --no-default-features --features arrow
      - name: Doctests (all features)
        run: cargo test --locked --doc --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-hack
      # Read rust-version from Cargo.toml rather than duplicating it here.
      - name: Check every feature on MSRV
        run: cargo hack check --locked --rust-version --each-feature --all-targets

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  workflows:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail on findings without requiring SARIF upload permissions.
          advanced-security: false

  ci-gate:
    name: CI gate
    needs: [checks, test, msrv, audit, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
